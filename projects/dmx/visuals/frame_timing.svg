<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-label="DMX data frame channel structure and timing calculation"><rect width="960" height="535" rx="22" fill="#fbf8fb"/><rect x="16" y="16" width="928" height="503" rx="16" fill="white" stroke="#e9dbe6" stroke-width="2"/><text x="52" y="61" fill="#402943" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700">DMX512 | Frame timing reconstruction</text><text x="52" y="90" fill="#594359" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400">Arduino Serial1 at 250 kbaud, 8N2, 513 serial slots per frame</text><rect x="50" y="137" width="66" height="75" rx="8" fill="#b8668e"/><text x="83" y="180" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">BREAK</text><rect x="120" y="137" width="50" height="75" rx="8" fill="#d3aec7"/><text x="145" y="180" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">MAB</text><rect x="174" y="137" width="108" height="75" rx="8" fill="#535972"/><text x="228" y="180" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">0 start</text><rect x="286" y="137" width="121" height="75" rx="8" fill="#c4576f"/><text x="346.5" y="180" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">1 Red</text><rect x="411" y="137" width="121" height="75" rx="8" fill="#539e73"/><text x="471.5" y="180" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">2 Green</text><rect x="536" y="137" width="121" height="75" rx="8" fill="#5278b6"/><text x="596.5" y="180" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">3 Blue</text><rect x="661" y="137" width="246" height="75" rx="8" fill="#8b72ad"/><text x="784" y="180" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700">4 White…512</text><rect x="49" y="229" width="864" height="36" rx="6" fill="#f8f5f8"/><text x="65" y="252" fill="#5c4a5d" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400">513 slots × 11 bits / 250,000 bits/s</text><text x="884" y="252" fill="#514359" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="700">22.572 ms</text><rect x="49" y="273" width="864" height="36" rx="6" fill="#fff"/><text x="65" y="296" fill="#5c4a5d" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400">Firmware BREAK (120 µs) + MAB (16 µs)</text><text x="884" y="296" fill="#514359" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="700">0.136 ms</text><rect x="49" y="317" width="864" height="36" rx="6" fill="#f8f5f8"/><text x="65" y="340" fill="#5c4a5d" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400">Nominal minimum frame serialization</text><text x="884" y="340" fill="#514359" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="700">22.708 ms</text><rect x="49" y="361" width="864" height="36" rx="6" fill="#fff"/><text x="65" y="384" fill="#5c4a5d" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400">Additional loop delay(25)</text><text x="884" y="384" fill="#514359" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="700">25 ms</text><rect x="49" y="405" width="864" height="36" rx="6" fill="#f2e2ed"/><text x="65" y="428" fill="#78405e" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700">Approximate cycle period / refresh</text><text x="884" y="428" fill="#92446f" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="700">47.708 ms / 20.96 Hz</text><text x="52" y="499" fill="#82697c" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="400">Analytical estimate only: excludes computation, UART setup overhead, jitter and physical measurements.</text></svg>