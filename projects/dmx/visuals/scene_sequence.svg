<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-label="Original DMX demo sequence and brightness scaling"><rect width="960" height="510" rx="22" fill="#fbf8fb"/><rect x="16" y="16" width="928" height="478" rx="16" fill="white" stroke="#e9dbe6" stroke-width="2"/><text x="52" y="60" fill="#402943" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700">Scene sequencing and dimming</text><text x="52" y="90" fill="#594359" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400">Source timing constants and integer channel-byte calculations, not measured fixture output</text><rect x="53" y="148" width="107" height="77" rx="9" fill="#c4576f"/><text x="106.5" y="178" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">Red</text><text x="106.5" y="203" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400">0–2.5s</text><rect x="165" y="148" width="109" height="77" rx="9" fill="#539e73"/><text x="219.5" y="178" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">Green</text><text x="219.5" y="203" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400">2.5–5s</text><rect x="279" y="148" width="109" height="77" rx="9" fill="#5278b6"/><text x="333.5" y="178" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">Blue</text><text x="333.5" y="203" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400">5–7.5s</text><rect x="393" y="148" width="109" height="77" rx="9" fill="#a5a9b7"/><text x="447.5" y="178" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">White</text><text x="447.5" y="203" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400">7.5–10s</text><rect x="507" y="148" width="247" height="77" rx="9" fill="#9771ad"/><text x="630.5" y="178" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">Gradient</text><text x="630.5" y="203" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400">10–20s</text><rect x="759" y="148" width="125" height="77" rx="9" fill="#555865"/><text x="821.5" y="178" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700">Off</text><text x="821.5" y="203" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400">20s+</text><text x="54" y="268" fill="#553e55" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700">Gradient: Red → Yellow → Green → Cyan → Blue → Magenta → Red</text><text x="54" y="298" fill="#594359" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400">3 seconds per color transition; ideal six-step cycle = 18 seconds.</text><text x="54" y="346" fill="#553e55" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700">Brightness byte scaling (initial intensity = 255)</text><rect x="65" y="369" width="151" height="23" rx="4" fill="#eee8ef"/><rect x="65" y="369" width="0" height="23" rx="4" fill="#b14f83"/><text x="140" y="417" fill="#674c66" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">0% → 0</text><rect x="242" y="369" width="151" height="23" rx="4" fill="#eee8ef"/><rect x="242" y="369" width="1.184313725490196" height="23" rx="4" fill="#b14f83"/><text x="317" y="417" fill="#674c66" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">1% → 2</text><rect x="419" y="369" width="151" height="23" rx="4" fill="#eee8ef"/><rect x="419" y="369" width="14.80392156862745" height="23" rx="4" fill="#b14f83"/><text x="494" y="417" fill="#674c66" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">10% → 25</text><rect x="596" y="369" width="151" height="23" rx="4" fill="#eee8ef"/><rect x="596" y="369" width="75.20392156862745" height="23" rx="4" fill="#b14f83"/><text x="671" y="417" fill="#674c66" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">50% → 127</text><rect x="773" y="369" width="151" height="23" rx="4" fill="#eee8ef"/><rect x="773" y="369" width="151" height="23" rx="4" fill="#b14f83"/><text x="848" y="417" fill="#674c66" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700">100% → 255</text><text x="52" y="469" fill="#80677b" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="400">DMX output uses floor(base × brightness / 100). Byte values do not specify actual LED current.</text></svg>