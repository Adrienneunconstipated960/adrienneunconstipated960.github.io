<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="dmx-title dmx-desc"><title id="dmx-title">DMX Controller - How browser controls reach an RGBW fixture</title><desc id="dmx-desc">Five-stage source-derived architecture showing HTTP commands, USB serial to Arduino Mega, a DMX transmitter, and an assumed properly wired RGBW fixture; hardware validation has not been performed.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141723"/><stop offset="1" stop-color="#2b2037"/></linearGradient><linearGradient id="gradient" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e56c85"/><stop offset=".2" stop-color="#f8bb66"/><stop offset=".4" stop-color="#60c98c"/><stop offset=".6" stop-color="#77dbdf"/><stop offset=".8" stop-color="#719ee3"/><stop offset="1" stop-color="#d989d6"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#72627f" stroke-width=".8" opacity=".12"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#f0b6d1" stroke-width="1.5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><rect width="1280" height="720" rx="22" fill="url(#bg)"/><rect width="1280" height="720" rx="22" fill="url(#grid)"/><rect x="37" y="32" width="7" height="87" rx="3" fill="#dc558e"/><text x="65" y="75" font-size="40" font-weight="800" fill="#fff5fb" >DMX Controller</text><text x="68" y="111" font-size="20" font-weight="600" fill="#f0b0d0" >How browser controls reach an RGBW fixture</text>
<text x="48" y="163" font-size="17" font-weight="800" fill="#e7a0c6" >SOURCE-DEFINED SOFTWARE PATH · FIXTURE CONNECTION NOT RETESTED</text>
<rect x="41" y="209" width="224" height="229" rx="15" fill="#32243b" stroke="#e388b9" stroke-width="2"/><text x="59" y="258" font-size="30" font-weight="800" fill="#e388b9" >01</text><text x="59" y="302" font-size="19" font-weight="750" fill="#fff" >BROWSER UI</text><text x="59" y="344" font-size="15" font-weight="500" fill="#e3d7e6" >Scene buttons</text><text x="59" y="371" font-size="15" font-weight="500" fill="#e3d7e6" >Brightness (0–100%)</text><path d="M266 324L283 324" fill="none" stroke="#eab1d0" stroke-width="3" marker-end="url(#arrow)"/><rect x="288" y="209" width="224" height="229" rx="15" fill="#233343" stroke="#84d6e4" stroke-width="2"/><text x="306" y="258" font-size="30" font-weight="800" fill="#84d6e4" >02</text><text x="306" y="302" font-size="19" font-weight="750" fill="#fff" >FLASK SERVER</text><text x="306" y="344" font-size="15" font-weight="500" fill="#e3d7e6" >Local HTTP routes</text><text x="306" y="371" font-size="15" font-weight="500" fill="#e3d7e6" >Validated commands</text><path d="M513 324L530 324" fill="none" stroke="#eab1d0" stroke-width="3" marker-end="url(#arrow)"/><rect x="535" y="209" width="224" height="229" rx="15" fill="#32243b" stroke="#e388b9" stroke-width="2"/><text x="553" y="258" font-size="30" font-weight="800" fill="#e388b9" >03</text><text x="553" y="302" font-size="19" font-weight="750" fill="#fff" >USB SERIAL</text><text x="553" y="344" font-size="15" font-weight="500" fill="#e3d7e6" >Newline-delimited</text><text x="553" y="371" font-size="15" font-weight="500" fill="#e3d7e6" >ASCII · 115,200 baud</text><path d="M760 324L777 324" fill="none" stroke="#eab1d0" stroke-width="3" marker-end="url(#arrow)"/><rect x="782" y="209" width="224" height="229" rx="15" fill="#233343" stroke="#84d6e4" stroke-width="2"/><text x="800" y="258" font-size="30" font-weight="800" fill="#84d6e4" >04</text><text x="800" y="302" font-size="19" font-weight="750" fill="#fff" >ARDUINO MEGA</text><text x="800" y="344" font-size="15" font-weight="500" fill="#e3d7e6" >Parse commands</text><text x="800" y="371" font-size="15" font-weight="500" fill="#e3d7e6" >Build DMX slots</text><path d="M1007 324L1024 324" fill="none" stroke="#eab1d0" stroke-width="3" marker-end="url(#arrow)"/><rect x="1029" y="209" width="224" height="229" rx="15" fill="#32243b" stroke="#e388b9" stroke-width="2"/><text x="1047" y="258" font-size="30" font-weight="800" fill="#e388b9" >05</text><text x="1047" y="302" font-size="19" font-weight="750" fill="#fff" >DMX FIXTURE</text><text x="1047" y="344" font-size="15" font-weight="500" fill="#e3d7e6" >RS-485 transceiver</text><text x="1047" y="371" font-size="15" font-weight="500" fill="#e3d7e6" >RGBW channels 1–4</text>
<rect x="45" y="469" width="1190" height="151" rx="15" fill="#34263b" stroke="#a66d96" stroke-width="2"/>
<text x="70" y="512" font-size="17" font-weight="800" fill="#f6b4d6" >FROM COMMAND TO FRAME</text>
<text x="70" y="550" font-size="18" font-weight="650" fill="#fff" >POST /scene/&lt;name&gt; or /brightness/&lt;value&gt;  →  Arduino Serial  →  DMX512-A-style frame</text>
<text x="70" y="585" font-size="16" font-weight="500" fill="#e5d7e5" >Start code 0  ·  RGBW slots 1–4  ·  other 508 channel slots zero</text>
<text x="43" y="684" font-size="14" font-weight="500" fill="#d4c6dc" >CONCEPTUAL ARCHITECTURE · NOT VERIFIED WIRING, TRANSMISSION OR FIXTURE RESPONSE</text></g></svg>