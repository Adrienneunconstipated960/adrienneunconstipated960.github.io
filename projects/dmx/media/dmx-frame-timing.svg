<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="dmx-title dmx-desc"><title id="dmx-title">DMX Controller - DMX frame structure and nominal software timing</title><desc id="dmx-desc">Firmware-derived arithmetic for 513 DMX slots including the start code. Nominal loop rate assumes 120 microsecond BREAK, 16 microsecond mark-after-break, 22.572 milliseconds of data and a further 25 millisecond delay. No oscilloscope measurements.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141723"/><stop offset="1" stop-color="#2b2037"/></linearGradient><linearGradient id="gradient" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e56c85"/><stop offset=".2" stop-color="#f8bb66"/><stop offset=".4" stop-color="#60c98c"/><stop offset=".6" stop-color="#77dbdf"/><stop offset=".8" stop-color="#719ee3"/><stop offset="1" stop-color="#d989d6"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#72627f" stroke-width=".8" opacity=".12"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#f0b6d1" stroke-width="1.5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><rect width="1280" height="720" rx="22" fill="url(#bg)"/><rect width="1280" height="720" rx="22" fill="url(#grid)"/><rect x="37" y="32" width="7" height="87" rx="3" fill="#dc558e"/><text x="65" y="75" font-size="40" font-weight="800" fill="#fff5fb" >DMX Controller</text><text x="68" y="111" font-size="20" font-weight="600" fill="#f0b0d0" >DMX frame structure and nominal software timing</text>
<text x="46" y="158" font-size="17" font-weight="800" fill="#f2b9da" >DMX FRAME LAYOUT · TIMING BLOCKS ARE NOT DRAWN TO SCALE</text>
<rect x="43" y="183" width="1193" height="212" rx="15" fill="#222a3c" stroke="#6a7391" stroke-width="2"/>
<text x="64" y="220" font-size="16" font-weight="800" fill="#f8bad9" >BREAK</text>
<text x="64" y="248" font-size="21" font-weight="750" fill="#fff" >120 µs</text>
<rect x="65" y="273" width="135" height="49" rx="8" fill="#ae457b"/>
<text x="229" y="220" font-size="16" font-weight="800" fill="#a3e5ec" >MAB</text><text x="229" y="248" font-size="21" font-weight="750" fill="#fff" >16 µs</text>
<rect x="227" y="273" width="90" height="49" rx="8" fill="#358fa2"/>
<text x="347" y="220" font-size="19" font-weight="750" fill="#fae7f5" >513 serial slots · 22.572 ms</text>
<rect x="347" y="273" width="92" height="49" rx="7" fill="#a576ab"/><text x="393" y="292" font-size="12" font-weight="750" fill="#fff" text-anchor="middle">START</text><text x="393" y="311" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">0</text><rect x="445" y="273" width="112" height="49" rx="7" fill="#d85c85"/><text x="501" y="292" font-size="12" font-weight="750" fill="#fff" text-anchor="middle">R</text><text x="501" y="311" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="563" y="273" width="112" height="49" rx="7" fill="#54a97a"/><text x="619" y="292" font-size="12" font-weight="750" fill="#fff" text-anchor="middle">G</text><text x="619" y="311" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="681" y="273" width="112" height="49" rx="7" fill="#588acc"/><text x="737" y="292" font-size="12" font-weight="750" fill="#fff" text-anchor="middle">B</text><text x="737" y="311" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="799" y="273" width="112" height="49" rx="7" fill="#b6beca"/><text x="855" y="292" font-size="12" font-weight="750" fill="#fff" text-anchor="middle">W</text><text x="855" y="311" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="917" y="273" width="234" height="49" rx="7" fill="#4b576c"/><text x="1034" y="292" font-size="12" font-weight="750" fill="#fff" text-anchor="middle">UNUSED</text><text x="1034" y="311" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5–512</text>
<text x="64" y="363" font-size="16" font-weight="500" fill="#d9d5e4" >250,000 baud · 8N2 = 11 bits per slot · 512 data channels + start code</text>
<rect x="45" y="424" width="563" height="187" rx="15" fill="#30273f" stroke="#af6798" stroke-width="2"/>
<text x="70" y="468" font-size="17" font-weight="800" fill="#fac2df" >MINIMUM NOMINAL FRAME</text>
<text x="70" y="516" font-size="35" font-weight="800" fill="#fff" >22.708 ms</text>
<text x="70" y="554" font-size="15" font-weight="500" fill="#e4d6e6" >22.572 ms data + 0.120 ms BREAK + 0.016 ms MAB</text>
<rect x="635" y="424" width="600" height="187" rx="15" fill="#263342" stroke="#76bfce" stroke-width="2"/>
<text x="659" y="468" font-size="17" font-weight="800" fill="#a7edf4" >LOOP ESTIMATE (PLUS 25 ms DELAY)</text>
<text x="659" y="516" font-size="31" font-weight="800" fill="#fff" >≈ 20.96 frames / second</text>
<text x="659" y="554" font-size="16" font-weight="500" fill="#d7e1ec" >47.708 ms minimum software cycle</text>
<text x="43" y="684" font-size="14" font-weight="500" fill="#d4c6dc" >CALCULATED FROM FIRMWARE CONSTANTS · NOT OSCILLOSCOPE-CAPTURED DMX TIMING</text></g></svg>