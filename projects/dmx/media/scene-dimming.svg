<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="dmx-title dmx-desc"><title id="dmx-title">DMX Controller - Scene choreography and integer dimming</title><desc id="dmx-desc">Idealized twenty-second demo timeline and integer brightness scaling derived from the recovered sketch. No physical lamp brightness or optical output is measured.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141723"/><stop offset="1" stop-color="#2b2037"/></linearGradient><linearGradient id="gradient" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e56c85"/><stop offset=".2" stop-color="#f8bb66"/><stop offset=".4" stop-color="#60c98c"/><stop offset=".6" stop-color="#77dbdf"/><stop offset=".8" stop-color="#719ee3"/><stop offset="1" stop-color="#d989d6"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#72627f" stroke-width=".8" opacity=".12"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#f0b6d1" stroke-width="1.5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><rect width="1280" height="720" rx="22" fill="url(#bg)"/><rect width="1280" height="720" rx="22" fill="url(#grid)"/><rect x="37" y="32" width="7" height="87" rx="3" fill="#dc558e"/><text x="65" y="75" font-size="40" font-weight="800" fill="#fff5fb" >DMX Controller</text><text x="68" y="111" font-size="20" font-weight="600" fill="#f0b0d0" >Scene choreography and integer dimming</text>
<text x="49" y="163" font-size="17" font-weight="800" fill="#f0b3d3" >NOMINAL DEMO TIMELINE · CODE INTENT, NOT FRAME CAPTURE</text>
<rect x="44" y="188" width="1191" height="202" rx="15" fill="#242b3d" stroke="#836788" stroke-width="2"/>
<rect x="58" y="238" width="143" height="83" rx="9" fill="#a92f52"/><text x="129.5" y="272" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">RED</text><text x="129.5" y="299" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">0–2.5 s</text><rect x="206" y="238" width="143" height="83" rx="9" fill="#2e855e"/><text x="277.5" y="272" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">GREEN</text><text x="277.5" y="299" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">2.5–5 s</text><rect x="354" y="238" width="143" height="83" rx="9" fill="#375f9e"/><text x="425.5" y="272" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">BLUE</text><text x="425.5" y="299" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">5–7.5 s</text><rect x="502" y="238" width="143" height="83" rx="9" fill="#969eb3"/><text x="573.5" y="272" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">WHITE</text><text x="573.5" y="299" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">7.5–10 s</text><rect x="650" y="238" width="418" height="83" rx="9" fill="url(#gradient)"/><text x="859" y="272" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">GRADIENT</text><text x="859" y="299" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">10–20 s</text><rect x="1073" y="238" width="139" height="83" rx="9" fill="#3c4354"/><text x="1142.5" y="272" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">OFF</text><text x="1142.5" y="299" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">20 s+</text>
<text x="63" y="363" font-size="16" font-weight="500" fill="#e6d6e7" >Gradient steps: red → yellow → green → cyan → blue → magenta (3 s nominal per transition)</text>
<rect x="45" y="424" width="1190" height="205" rx="15" fill="#32263e" stroke="#a86b97" stroke-width="2"/>
<text x="69" y="464" font-size="16" font-weight="800" fill="#ffc3df" >DMX INTENSITY SCALING · ACTIVE CHANNEL BASE VALUE 255</text>
<rect x="67" y="490" width="203" height="20" rx="8" fill="#605466"/><rect x="67" y="490" width="1" height="20" rx="8" fill="#e987b9"/><text x="69" y="542" font-size="22" font-weight="750" fill="#fff" >0%  →  0</text><text x="69" y="566" font-size="14" font-weight="500" fill="#e6d7e6" >channel byte</text><rect x="304" y="490" width="203" height="20" rx="8" fill="#605466"/><rect x="304" y="490" width="1.592156862745098" height="20" rx="8" fill="#e987b9"/><text x="306" y="542" font-size="22" font-weight="750" fill="#fff" >1%  →  2</text><text x="306" y="566" font-size="14" font-weight="500" fill="#e6d7e6" >channel byte</text><rect x="541" y="490" width="203" height="20" rx="8" fill="#605466"/><rect x="541" y="490" width="19.901960784313726" height="20" rx="8" fill="#e987b9"/><text x="543" y="542" font-size="22" font-weight="750" fill="#fff" >10%  →  25</text><text x="543" y="566" font-size="14" font-weight="500" fill="#e6d7e6" >channel byte</text><rect x="778" y="490" width="203" height="20" rx="8" fill="#605466"/><rect x="778" y="490" width="101.10196078431373" height="20" rx="8" fill="#e987b9"/><text x="780" y="542" font-size="22" font-weight="750" fill="#fff" >50%  →  127</text><text x="780" y="566" font-size="14" font-weight="500" fill="#e6d7e6" >channel byte</text><rect x="1015" y="490" width="203" height="20" rx="8" fill="#605466"/><rect x="1015" y="490" width="203" height="20" rx="8" fill="#e987b9"/><text x="1017" y="542" font-size="22" font-weight="750" fill="#fff" >100%  →  255</text><text x="1017" y="566" font-size="14" font-weight="500" fill="#e6d7e6" >channel byte</text>
<text x="69" y="605" font-size="15" font-weight="500" fill="#eddbec" >floor(255 × brightness% / 100)   ·   DMX value is not LED current or measured light output</text>
<text x="43" y="684" font-size="14" font-weight="500" fill="#d4c6dc" >IDEALIZED DEMO SEQUENCE · FIRMWARE GRADIENT STATE MAY START DIFFERENTLY AT 10 SECONDS</text></g></svg>