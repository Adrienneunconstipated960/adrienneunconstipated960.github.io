<text x="44" y="690" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#cbbfd3" >PROFILE-BASED CALCULATIONS ONLY · OUTPUT IS NOT AUTOMATICALLY CURRENT-LIMITED</text></svg>