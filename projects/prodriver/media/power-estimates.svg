<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="p-title p-desc"><title id="p-title">ProDriver Sim - Predicted electrical operating points</title><desc id="p-desc">Calculated BST1 and HO7 profile-based output and input power estimates. These are model results, not instrument readings, and efficiency estimates below first table point are uncertain.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141720"/><stop offset="1" stop-color="#292038"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0V40M0 0H40" stroke="#66536e" stroke-width=".7" opacity=".14" fill="none"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#e9accc" stroke-width="1.5"/></marker></defs><rect width="1280" height="720" rx="20" fill="url(#bg)"/><rect width="1280" height="720" rx="20" fill="url(#grid)"/><rect x="38" y="34" width="7" height="88" rx="4" fill="#dc5693"/><text x="65" y="76" font-family="Arial,Helvetica,sans-serif" font-size="41" font-weight="800" fill="#fff4fa" >ProDriver Sim</text><text x="68" y="114" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#efacd0" >Predicted electrical operating points</text>
<text x="46" y="161" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#f4b5d2" >CALCULATED ESTIMATES · NO MEASURED POWER-ANALYZER DATA</text>
<rect x="47" y="200" width="565" height="250" rx="15" fill="#27263a" stroke="#ef8dbb" stroke-width="2"/><text x="72" y="241" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="750" fill="#fff" >HO7 4800 lm · 0.60 A</text><text x="72" y="278" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#d4cada" >120 V input / BST1 model</text><text x="72" y="317" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="750" fill="#ef8dbb" >Pout  26.82 W</text><text x="72" y="348" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#eae3ee" >Pin    30.36 W</text><rect x="72" y="370" width="485" height="15" rx="7" fill="#64556b"/><rect x="72" y="370" width="428.4" height="15" rx="7" fill="#ef8dbb"/><text x="72" y="410" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="650" fill="#f7eef6" >Estimated efficiency: 88.34%</text>
<rect x="667" y="200" width="565" height="250" rx="15" fill="#27263a" stroke="#78d7e5" stroke-width="2"/><text x="692" y="241" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="750" fill="#fff" >HO7 6400 lm · 0.80 A</text><text x="692" y="278" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#d4cada" >120 V input / BST1 model</text><text x="692" y="317" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="750" fill="#78d7e5" >Pout  35.76 W</text><text x="692" y="348" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#eae3ee" >Pin    40.24 W</text><rect x="692" y="370" width="485" height="15" rx="7" fill="#64556b"/><rect x="692" y="370" width="431.0" height="15" rx="7" fill="#78d7e5"/><text x="692" y="410" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="650" fill="#f7eef6" >Estimated efficiency: 88.86%</text>
<rect x="47" y="480" width="1185" height="153" rx="15" fill="#32283b" stroke="#97658f" stroke-width="2"/>
<text x="72" y="521" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="750" fill="#fff" >Pout = Vmodule × Imodule</text>
<text x="72" y="554" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#f2d5e7" >Pin estimate = Pout / estimated efficiency</text>
<text x="72" y="591" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#dcd2df" >The efficiency estimator blends lookup tables; its output is not hardware validation.</text>
