<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="p-title p-desc"><title id="p-title">ProDriver Sim - Source-based electrical model architecture</title><desc id="p-desc">A five-stage data model explains the archived ProDriver application logic. Input curves and limits are from public JSON profiles, not reconstructed physical driver measurements.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141720"/><stop offset="1" stop-color="#292038"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0V40M0 0H40" stroke="#66536e" stroke-width=".7" opacity=".14" fill="none"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#e9accc" stroke-width="1.5"/></marker></defs><rect width="1280" height="720" rx="20" fill="url(#bg)"/><rect width="1280" height="720" rx="20" fill="url(#grid)"/><rect x="38" y="34" width="7" height="88" rx="4" fill="#dc5693"/><text x="65" y="76" font-family="Arial,Helvetica,sans-serif" font-size="41" font-weight="800" fill="#fff4fa" >ProDriver Sim</text><text x="68" y="114" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#efacd0" >Source-based electrical model architecture</text>
<text x="48" y="162" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#eca3ca" >ORIGINAL IMPLEMENTATION FEATURES · SOURCE REVIEW</text>
<rect x="42" y="218" width="225" height="217" rx="15" fill="#32243b" stroke="#dc78a8" stroke-width="2"/><text x="61" y="260" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#f6aed2" >01</text><text x="61" y="308" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="750" fill="#fff" >Driver profile</text><text x="61" y="350" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#e0d5e3" >BST1 JSON</text><text x="61" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#e0d5e3" >limits + efficiency</text><path d="M268 321L288 321" fill="none" stroke="#ec9cbf" stroke-width="3" marker-end="url(#arrow)"/><rect x="290" y="218" width="225" height="217" rx="15" fill="#243142" stroke="#70cedb" stroke-width="2"/><text x="309" y="260" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#9de8ee" >02</text><text x="309" y="308" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="750" fill="#fff" >LED module</text><text x="309" y="350" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#e0d5e3" >HO7 lookup table</text><text x="309" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#e0d5e3" >current / voltage</text><path d="M516 321L536 321" fill="none" stroke="#ec9cbf" stroke-width="3" marker-end="url(#arrow)"/><rect x="538" y="218" width="225" height="217" rx="15" fill="#32243b" stroke="#dc78a8" stroke-width="2"/><text x="557" y="260" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#f6aed2" >03</text><text x="557" y="308" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="750" fill="#fff" >Interpolation</text><text x="557" y="350" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#e0d5e3" >I–V reference</text><text x="557" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#e0d5e3" >voltage prediction</text><path d="M764 321L784 321" fill="none" stroke="#ec9cbf" stroke-width="3" marker-end="url(#arrow)"/><rect x="786" y="218" width="225" height="217" rx="15" fill="#243142" stroke="#70cedb" stroke-width="2"/><text x="805" y="260" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#9de8ee" >04</text><text x="805" y="308" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="750" fill="#fff" >Power model</text><text x="805" y="350" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#e0d5e3" >Output = V × I</text><text x="805" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#e0d5e3" >Input = Pout / eta</text><path d="M1012 321L1032 321" fill="none" stroke="#ec9cbf" stroke-width="3" marker-end="url(#arrow)"/><rect x="1034" y="218" width="225" height="217" rx="15" fill="#32243b" stroke="#dc78a8" stroke-width="2"/><text x="1053" y="260" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#f6aed2" >05</text><text x="1053" y="308" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="750" fill="#fff" >Status flags</text><text x="1053" y="350" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#e0d5e3" >Out-of-range warnings</text><text x="1053" y="375" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#e0d5e3" >not automatic limits</text>
<rect x="44" y="468" width="1190" height="157" rx="15" fill="#302438" stroke="#a56c96" stroke-width="2"/>
<text x="70" y="505" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#f5b7d8" >SIMULATION OUTPUTS</text>
<text x="70" y="547" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" >Vmodule, Pout, estimated efficiency, estimated Pin</text>
<text x="70" y="584" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#f4dfec" >Warnings identify limit violations. The model does not reduce the commanded current.</text>
