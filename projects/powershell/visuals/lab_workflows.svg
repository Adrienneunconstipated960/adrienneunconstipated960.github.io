<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="tt dd"><title id="tt">Four PowerShell operating system coursework labs</title><desc id="dd">Original fall 2026 work on system inventory, CSV sorting, concurrency, and memory audits.</desc><rect width="960" height="500" rx="18" fill="#fbf8fb"/><rect x="12" y="12" width="936" height="476" rx="14" fill="#fff" stroke="#e7dbe7" stroke-width="2"/><text x="50" y="62" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#3c283f" text-anchor="start">PowerShell Systems | Four laboratory workflows</text><text x="50" y="90" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#533952" text-anchor="start">Source: Original CS646 fall 2026 Lab 1 through Lab 4 reports</text><rect x="49" y="137" width="424" height="122" rx="10" fill="#f7eaf0" stroke="#b95686" stroke-width="2"/><text x="70" y="173" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#b95686" text-anchor="start">Lab 1</text><text x="160" y="171" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#50334d" text-anchor="start">Inventory</text><text x="160" y="204" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#533952" text-anchor="start">CPU, memory, storage</text><text x="160" y="228" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#533952" text-anchor="start">network, packages, kernel</text><rect x="501" y="137" width="424" height="122" rx="10" fill="#ecf2f8" stroke="#4f8aa7" stroke-width="2"/><text x="522" y="173" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#4f8aa7" text-anchor="start">Lab 2</text><text x="612" y="171" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#50334d" text-anchor="start">Safe CSV sorting</text><text x="612" y="204" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#533952" text-anchor="start">Multi-key, full-row records</text><text x="612" y="228" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#533952" text-anchor="start">SHA256, append-only log</text><rect x="49" y="280" width="424" height="122" rx="10" fill="#eef5ea" stroke="#7da65e" stroke-width="2"/><text x="70" y="316" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#7da65e" text-anchor="start">Lab 3</text><text x="160" y="314" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#50334d" text-anchor="start">Concurrency</text><text x="160" y="347" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#533952" text-anchor="start">102 requests, 3 services</text><text x="160" y="371" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#533952" text-anchor="start">Throttle 10, file locking</text><rect x="501" y="280" width="424" height="122" rx="10" fill="#faf1e7" stroke="#b58b52" stroke-width="2"/><text x="522" y="316" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#b58b52" text-anchor="start">Lab 4</text><text x="612" y="314" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#50334d" text-anchor="start">Memory audit</text><text x="612" y="347" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#533952" text-anchor="start">RSS and VSZ per process</text><text x="612" y="371" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#533952" text-anchor="start">Per user, persistent samples</text><text x="51" y="461" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#7c6578" text-anchor="start">Container observations may include host or shared-kernel information, not only isolated resources.</text></svg>