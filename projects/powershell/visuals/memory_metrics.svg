<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="tt dd"><title id="tt">Memory measurement methodology comparison</title><desc id="dd">Original memory audit recorded RSS and VSZ. PSS and cgroup memory were explored as separate operating-system investigations.</desc><rect width="960" height="440" rx="18" fill="#fbf8fb"/><rect x="12" y="12" width="936" height="416" rx="14" fill="#fff" stroke="#e7dbe7" stroke-width="2"/><text x="49" y="59" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#3c283f" text-anchor="start">Lab 4 | Memory metric interpretation</text><text x="49" y="86" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#533952" text-anchor="start">Original script records process RSS and VSZ; PSS and cgroup data are separate checks.</text><rect x="42" y="152" width="213" height="141" rx="10" fill="#f8e8f1" stroke="#bc658d" stroke-width="2"/><text x="148" y="184" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#bc658d" text-anchor="middle">VSZ</text><text x="148" y="221" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4d3b50" text-anchor="middle">Virtual address space</text><text x="148" y="251" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#665468" text-anchor="middle">Reservations count</text><rect x="272" y="152" width="213" height="141" rx="10" fill="#ebf1f9" stroke="#6590b0" stroke-width="2"/><text x="378" y="184" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#6590b0" text-anchor="middle">RSS</text><text x="378" y="221" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4d3b50" text-anchor="middle">Resident memory</text><text x="378" y="251" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#665468" text-anchor="middle">Shared pages repeated</text><rect x="502" y="152" width="213" height="141" rx="10" fill="#edf4e9" stroke="#78a56f" stroke-width="2"/><text x="608" y="184" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#78a56f" text-anchor="middle">PSS</text><text x="608" y="221" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4d3b50" text-anchor="middle">Proportional set</text><text x="608" y="251" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#665468" text-anchor="middle">Shared pages divided</text><rect x="732" y="152" width="213" height="141" rx="10" fill="#fbf1e7" stroke="#b78950" stroke-width="2"/><text x="838" y="184" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#b78950" text-anchor="middle">cgroup</text><text x="838" y="221" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4d3b50" text-anchor="middle">Memory usage/limit</text><text x="838" y="251" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#665468" text-anchor="middle">Container controls</text><text x="51" y="340" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#644d61" text-anchor="start">Summed RSS can double-count shared libraries; virtual memory includes unmapped allocations.</text><text x="51" y="373" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#644d61" text-anchor="start">Use cgroup memory.current for container usage, not host-wide memory reported by free.</text><text x="51" y="410" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#7a667a" text-anchor="start">No raw memory time series was recovered; the figure explains measurement meaning, not observed trends.</text></svg>