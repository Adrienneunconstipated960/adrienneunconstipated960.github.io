<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="tt dd"><title id="tt">Reported lab runtime comparisons</title><desc id="dd">Lab 2 300,000-row sort and Lab 3 102 web requests; measured runtimes from original reports, not newly tested.</desc><rect width="960" height="540" rx="18" fill="#fbf8fb"/><rect x="12" y="12" width="936" height="516" rx="14" fill="#fff" stroke="#e7dbe7" stroke-width="2"/><text x="49" y="62" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#3c283f" text-anchor="start">Historical execution time comparisons</text><text x="49" y="90" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#533952" text-anchor="start">The two laboratory workloads are different; comparison bars are grouped by experiment.</text><text x="48" y="168" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#52384d" text-anchor="start">Lab 2: CSV sort</text><text x="48" y="194" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#796b79" text-anchor="start">300,000 rows</text><rect x="315" y="148" width="520" height="35" rx="10" fill="#f1eaf0" stroke="#f1eaf0" stroke-width="2"/><rect x="315" y="148" width="474.6" height="35" rx="5" fill="#be5b8c"/><text x="324" y="172" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="start">Serial</text><text x="799.6181818181817" y="173" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#804560" text-anchor="start">10.04 s</text><rect x="315" y="194" width="520" height="35" rx="10" fill="#f1eaf0" stroke="#f1eaf0" stroke-width="2"/><rect x="315" y="194" width="339.9" height="35" rx="5" fill="#5885a7"/><text x="324" y="219" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="start">Concurrent</text><text x="664.8909090909092" y="219" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#446e8b" text-anchor="start">7.19 s</text><text x="831" y="255" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#604b5a" text-anchor="end">Reported speedup: 1.40×</text><text x="48" y="341" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#52384d" text-anchor="start">Lab 3: web requests</text><text x="48" y="367" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#796b79" text-anchor="start">102 requests, throttle 10</text><rect x="315" y="321" width="520" height="35" rx="10" fill="#f1eaf0" stroke="#f1eaf0" stroke-width="2"/><rect x="315" y="321" width="410.8" height="35" rx="5" fill="#be5b8c"/><text x="324" y="345" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="start">Serial</text><text x="735.8" y="346" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#804560" text-anchor="start">8.69 s</text><rect x="315" y="367" width="520" height="35" rx="10" fill="#f1eaf0" stroke="#f1eaf0" stroke-width="2"/><rect x="315" y="367" width="79.4" height="35" rx="5" fill="#5885a7"/><text x="324" y="392" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="start">Concurrent</text><text x="404.4181818181818" y="392" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#446e8b" text-anchor="start">1.68 s</text><text x="831" y="428" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#604b5a" text-anchor="end">Reported speedup: 5.17×</text><text x="50" y="509" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#7b6578" text-anchor="start">Speedups may reflect overlapping I/O and network waits; they do not by themselves prove CPU parallelism.</text></svg>