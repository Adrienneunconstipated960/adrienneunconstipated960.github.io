<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="dashboard-title dashboard-desc">
<title id="dashboard-title">Thermal Logger graphical user interface, conceptual visualization</title>
<desc id="dashboard-desc">A source-informed visual mockup of a thermal test configuration window and live four-channel plot. All plotted values are synthetic examples, not measurements or a captured application screenshot. The source supports up to eight thermocouple channels and optional ambient control.</desc>
