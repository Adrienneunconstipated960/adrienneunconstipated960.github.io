<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Thermal Logger source-based functional system architecture</title>
<desc id="diagram-description">Eight thermocouple inputs plus optional cold junction connect to Pico TC-08 hardware, a Windows device driver, and a Python Tkinter coordinator. The coordinator provides plotting and CSV or optional Excel exports. An optional serial branch communicates with an Arduino ambient controller, but the controller firmware and physical wiring are not verified.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#131a2b"/><stop offset="1" stop-color="#252038"/></linearGradient><linearGradient id="active" x2="1" y2="1"><stop stop-color="#853b75"/><stop offset="1" stop-color="#432a54"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" stroke="#f2b2d7" stroke-width="1.4" fill="none"/></marker><marker id="bluearrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" stroke="#78cadd" stroke-width="1.4" fill="none"/></marker></defs>
<rect width="1280" height="650" rx="24" fill="url(#bg)"/>
<circle cx="1175" cy="105" r="200" fill="#713b78" opacity=".10"/><circle cx="62" cy="622" r="180" fill="#398da0" opacity=".07"/>
<text x="55" y="65" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#eca8ce" letter-spacing="2">THERMAL LOGGER / SOURCE-BASED ARCHITECTURE</text>
<text x="55" y="102" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#f9f4fd">From temperature sensing to live trends and test records</text>
<text x="55" y="130" font-family="system-ui,sans-serif" font-size="15" fill="#c6bdd6">Recovered software structure, not a photographed or instrument-validated test setup</text>
<g font-family="system-ui,sans-serif">
  <rect x="42" y="204" width="184" height="190" rx="18" fill="#283345" stroke="#628b9f" stroke-width="2"/>
  <rect x="59" y="222" width="94" height="27" rx="13" fill="#3b6879"/><text x="72" y="240" font-size="12" font-weight="800" fill="#ecfaff">INPUT</text>
  <text x="60" y="283" font-size="22" font-weight="800" fill="#fff">Thermocouples</text><text x="60" y="314" font-size="15" fill="#e0e7f4">CH1–CH8 probes</text><text x="60" y="343" font-size="14" fill="#c5d4e3">Optional CJ (CH0)</text><text x="60" y="370" font-size="12" fill="#96a9ba">Hardware-dependent</text>
  <rect x="276" y="204" width="184" height="190" rx="18" fill="#283345" stroke="#628b9f" stroke-width="2"/>
  <rect x="293" y="222" width="88" height="27" rx="13" fill="#3b6879"/><text x="307" y="240" font-size="12" font-weight="800" fill="#ecfaff">DEVICE</text>
  <text x="294" y="283" font-size="25" font-weight="800" fill="#fff">Pico TC-08</text><text x="294" y="314" font-size="14" fill="#e0e7f4">Multi-channel</text><text x="294" y="336" font-size="14" fill="#e0e7f4">temperature input</text><text x="294" y="370" font-size="12" fill="#96a9ba">Not re-tested</text>
  <rect x="512" y="204" width="182" height="190" rx="18" fill="#293147" stroke="#856b99" stroke-width="2"/>
  <rect x="529" y="222" width="84" height="27" rx="13" fill="#614a7f"/><text x="544" y="240" font-size="12" font-weight="800" fill="#f7eaff">DRIVER</text>
  <text x="530" y="283" font-size="24" font-weight="800" fill="#fff">Windows</text><text x="530" y="310" font-size="16" fill="#e5dff1">TC-08 DLL</text><text x="530" y="338" font-size="13" fill="#d3c7e2">Temperature readout</text><text x="530" y="370" font-size="12" fill="#a99cb9">Driver integration</text>
  <rect x="746" y="188" width="214" height="222" rx="18" fill="url(#active)" stroke="#e6a0d0" stroke-width="3"/>
  <rect x="765" y="206" width="124" height="29" rx="14" fill="#9e5187"/><text x="780" y="226" font-size="12" font-weight="800" fill="#fff">APPLICATION</text>
  <text x="765" y="272" font-size="26" font-weight="800" fill="#fff">Python + Tkinter</text><text x="765" y="304" font-size="15" fill="#fff3fa">Test setup + channel</text><text x="765" y="326" font-size="15" fill="#fff3fa">selection + scheduling</text><text x="765" y="353" font-size="13" fill="#ebd2e9">Nominal 1 s UI poll</text><text x="765" y="381" font-size="12" fill="#e2c8dd">Cadence not time-verified</text>
  <rect x="1016" y="169" width="223" height="104" rx="16" fill="#2b3e4a" stroke="#78cadd" stroke-width="2"/>
  <text x="1034" y="201" font-size="13" font-weight="800" fill="#95e7fa">VISUAL OUTPUT</text><text x="1034" y="235" font-size="22" font-weight="800" fill="#fff">Live trend plots</text><text x="1034" y="255" font-size="12" fill="#d1e1ec">Graph window + channel filters</text>
  <rect x="1016" y="309" width="223" height="104" rx="16" fill="#3c2b43" stroke="#dc93b9" stroke-width="2"/>
  <text x="1034" y="341" font-size="13" font-weight="800" fill="#f2b4d3">DATA OUTPUT</text><text x="1034" y="374" font-size="22" font-weight="800" fill="#fff">CSV / Excel</text><text x="1034" y="394" font-size="12" fill="#ead6e9">Metadata + channel readings</text>
  <path d="M227 297H268M462 297H504M696 297H739" stroke="#f2b2d7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M960 257H983V221H1008M960 343H983V361H1008" stroke="#f2b2d7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M850 410V467H695" fill="none" stroke="#78cadd" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#bluearrow)"/>
  <rect x="315" y="454" width="383" height="134" rx="16" fill="#1e3544" stroke="#73bed1" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="338" y="481" font-size="12" font-weight="800" fill="#91e1ee" letter-spacing="1">OPTIONAL SERIAL CONTROL BRANCH</text>
  <text x="338" y="512" font-size="20" font-weight="800" fill="#fff">Arduino ambient interface</text>
  <text x="338" y="538" font-size="14" fill="#dbe9f3">SET / AMB commands · 9600 baud</text>
  <text x="338" y="560" font-size="13" fill="#b6cbd7">Companion firmware + wiring unavailable</text>
  <path d="M315 518H256" stroke="#78cadd" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="45" y="470" width="205" height="97" rx="14" fill="#253544" stroke="#5d94a8"/>
  <text x="62" y="497" font-size="12" font-weight="800" fill="#97d5e2">UNVERIFIED</text>
  <text x="62" y="525" font-size="18" font-weight="700" fill="#fff">Ambient hardware</text>
  <text x="62" y="547" font-size="12" fill="#cad7e4">Actuator + feedback</text>
  <text x="55" y="625" font-size="13" fill="#c7bdd5">Solid lines = source-defined data flow</text>
  <text x="495" y="625" font-size="13" fill="#87cddf">Dashed = optional connection, physical behavior not revalidated</text>
</g>
</svg>