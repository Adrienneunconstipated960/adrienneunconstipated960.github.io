<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="window-title window-desc">
<title id="window-title">Comparison of stable and unsettled synthetic thermal windows</title>
<desc id="window-desc">The software's source-level trend rule checks whether maximum temperature minus minimum temperature across the latest ten valid readings is at most three degrees Celsius. One simulated ten-sample window spans 1.2 degrees Celsius and passes the rule; another spans 5.3 degrees Celsius and fails. These are not recorded measurements.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#181b2d"/><stop offset="1" stop-color="#282038"/></linearGradient></defs>
<rect width="1280" height="650" rx="22" fill="url(#bg)"/>
<text x="49" y="48" fill="#f1a9d0" font-family="system-ui,sans-serif" font-size="16" font-weight="800" letter-spacing="1.4">ROLLING WINDOW / LOGIC VISUALIZATION</text>
<text x="49" y="82" fill="#fff4fa" font-family="system-ui,sans-serif" font-size="23" font-weight="750">Configured trend rule: maximum − minimum ≤ 3.0 °C over 10 valid readings</text>
<rect x="1001" y="23" width="228" height="30" rx="15" fill="#803556"/><text x="1115" y="43" text-anchor="middle" fill="#fff5fb" font-family="system-ui,sans-serif" font-size="12" font-weight="800">SYNTHETIC EXAMPLE ONLY</text>
<rect x="44" y="107" width="583" height="440" rx="17" fill="#233044" stroke="#57627a" stroke-width="2"/>
 <text x="78" y="147" fill="#f8ecf8" font-family="system-ui,sans-serif" font-size="24" font-weight="750">Example A</text>
 <text x="78" y="178" fill="#8ce1bc" font-family="system-ui,sans-serif" font-size="15" font-weight="700">WITHIN BAND · 10/10 samples</text>
