 <text x="331.5" y="483" text-anchor="middle" fill="#c1ced9" font-family="system-ui,sans-serif" font-size="15">Sample index 1–10 (no timestamps)</text>
 <text x="78" y="530" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="800">Range = 1.2 °C</text>
 <text x="582" y="528" text-anchor="end" fill="#bfc9d8" font-family="system-ui,sans-serif" font-size="14">Threshold 3.0 °C</text>
