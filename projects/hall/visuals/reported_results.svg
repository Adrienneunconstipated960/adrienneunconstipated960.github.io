<svg xmlns="http://www.w3.org/2000/svg" width="980" height="590" viewBox="0 0 980 590" role="img" aria-labelledby="title desc">
<title id="title">Reported wafer measurement uncertainty relative to estimates</title>
<desc id="desc">Three comparisons from December 2025 EE421 lab report. Resistivity nominal 11 milli-ohm, uncertainty 177 milli-ohm. Carrier concentration nominal 1.99 times ten to the fifteenth per cubic centimeter, uncertainty 3.04 times ten to the fifteenth. Mobility 2.9 times ten to the fifth square centimeters per volt second with uncertainty 4.62 times ten to the fifth. These are magnitude comparisons, not signed ranges.</desc>
<rect width="980" height="590" rx="22" fill="#fbf9fc"/>
<rect x="20" y="20" width="940" height="550" rx="18" fill="#fff" stroke="#e9dce5" stroke-width="2"/>
<text x="48" y="64" fill="#40283b" font-size="27" font-family="Arial,sans-serif" font-weight="700">Reported wafer results and uncertainty</text>
<text x="48" y="96" fill="#7b5b6c" font-size="15" font-family="Arial,sans-serif">EE421 original lab conclusion, December 2025. No reconstructed raw data.</text>
<rect x="50" y="120" width="21" height="13" rx="3" fill="#b83f75"/><text x="81" y="132" fill="#4a3141" font-size="15" font-family="Arial,sans-serif">Central estimate</text>
<rect x="244" y="120" width="21" height="13" rx="3" fill="#ccc1ce"/><text x="275" y="132" fill="#4a3141" font-size="15" font-family="Arial,sans-serif">Reported ± uncertainty magnitude</text>
<g font-family="Arial,sans-serif">
<rect x="48" y="151" width="884" height="118" rx="12" fill="#faf5f8" stroke="#e9dce5"/>
<text x="72" y="181" font-size="19" font-weight="700" fill="#4c2d42">Resistivity</text>
<text x="72" y="206" font-size="15" fill="#72596a">11 ± 177 mΩ (unit as written)</text>
<text x="72" y="237" font-size="15" fill="#9a315f">Uncertainty = 16.1× estimate</text>
<rect x="475" y="182" width="400" height="16" rx="6" fill="#ccc1ce"/>
<rect x="475" y="209" width="25" height="16" rx="6" fill="#b83f75"/>
<text x="886" y="196" fill="#5c4555" text-anchor="end" font-size="12">±177</text>
<text x="508" y="223" fill="#7d3156" font-size="12">11</text>
<rect x="48" y="281" width="884" height="118" rx="12" fill="#faf5f8" stroke="#e9dce5"/>
<text x="72" y="311" font-size="19" font-weight="700" fill="#4c2d42">Carrier concentration</text>
<text x="72" y="336" font-size="15" fill="#72596a">(1.99 ± 3.04) × 10¹⁵ cm⁻³</text>
<text x="72" y="367" font-size="15" fill="#9a315f">Uncertainty = 1.53× estimate</text>
<rect x="475" y="312" width="400" height="16" rx="6" fill="#ccc1ce"/>
<rect x="475" y="339" width="262" height="16" rx="6" fill="#b83f75"/>
<text x="886" y="326" fill="#5c4555" text-anchor="end" font-size="12">±3.04</text>
<text x="746" y="353" fill="#7d3156" font-size="12">1.99</text>
<rect x="48" y="411" width="884" height="118" rx="12" fill="#faf5f8" stroke="#e9dce5"/>
<text x="72" y="441" font-size="19" font-weight="700" fill="#4c2d42">Hall mobility</text>
<text x="72" y="466" font-size="15" fill="#72596a">(2.90 ± 4.62) × 10⁵ cm²/(V·s)</text>
<text x="72" y="497" font-size="15" fill="#9a315f">Uncertainty = 1.59× estimate</text>
<rect x="475" y="442" width="400" height="16" rx="6" fill="#ccc1ce"/>
<rect x="475" y="469" width="251" height="16" rx="6" fill="#b83f75"/>
<text x="886" y="456" fill="#5c4555" text-anchor="end" font-size="12">±4.62</text>
<text x="735" y="483" fill="#7d3156" font-size="12">2.90</text>
<text x="50" y="552" fill="#795a6c" font-size="14">Bars compare magnitudes within each row, on separate scales. They are not confidence intervals.</text>
</g></svg>