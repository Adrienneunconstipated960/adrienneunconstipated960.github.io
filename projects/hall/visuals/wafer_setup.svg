<title id="title">Conceptual Hall-effect wafer measurement arrangement</title>
<desc id="desc">Educational schematic, not the actual historical wiring. Four electrical contacts on a rectangular semiconductor specimen; a Hall magnetic field normal to wafer and an M91 FastHall instrument using a Van der Pauw setup.</desc>
