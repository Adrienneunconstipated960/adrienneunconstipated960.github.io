<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Hall-Effect Wafer Measurements - From four-contact readings to material transport properties</title><desc id="desc">Source-informed methodological diagram; original contact readings and calibration files are unavailable.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151723"/><stop offset="1" stop-color="#262038"/></linearGradient><linearGradient id="wafer" x2="1" y2="1"><stop stop-color="#8ab9d1"/><stop offset="1" stop-color="#4c6c96"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#74657f" stroke-width="1" opacity=".14" fill="none"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#edbbd2" stroke-width="1.5"/></marker></defs><rect width="1280" height="720" rx="22" fill="url(#bg)"/><rect width="1280" height="720" rx="22" fill="url(#grid)"/><rect x="38" y="34" width="7" height="83" rx="3.5" fill="#e65a98"/><text x="65" y="74" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#fff0fa" >Hall-Effect Wafer Measurements</text><text x="68" y="108" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#efa1c9" >From four-contact readings to material transport properties</text>
<text x="45" y="163" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#f3add0" >GENERAL METHOD · RECONSTRUCTED EQUATIONS, NOT ORIGINAL RAW SIGNALS</text>
<rect x="43" y="201" width="282" height="197" rx="16" fill="#30263d" stroke="#df7dab" stroke-width="2"/><text x="61" y="244" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#f6afd4" >01</text><text x="61" y="285" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="750" fill="#fff" >Check contacts</text><text x="61" y="322" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#e1d8e5" >Ohmic response,</text><text x="61" y="348" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#e1d8e5" >lead convention</text><path d="M327 298L346 298" fill="none" stroke="#dc76a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="348" y="201" width="282" height="197" rx="16" fill="#273143" stroke="#6bd0df" stroke-width="2"/><text x="366" y="244" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#9ae8ef" >02</text><text x="366" y="285" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="750" fill="#fff" >Four-terminal VdP</text><text x="366" y="322" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#e1d8e5" >Measure Rₐ and Rᵦ;</text><text x="366" y="348" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#e1d8e5" >solve sheet resistance</text><path d="M632 298L651 298" fill="none" stroke="#dc76a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="653" y="201" width="282" height="197" rx="16" fill="#30263d" stroke="#df7dab" stroke-width="2"/><text x="671" y="244" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#f6afd4" >03</text><text x="671" y="285" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="750" fill="#fff" >Hall response</text><text x="671" y="322" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#e1d8e5" >Apply field and current;</text><text x="671" y="348" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#e1d8e5" >observe transverse voltage</text><path d="M937 298L956 298" fill="none" stroke="#dc76a4" stroke-width="3" marker-end="url(#arrow)"/><rect x="958" y="201" width="282" height="197" rx="16" fill="#273143" stroke="#6bd0df" stroke-width="2"/><text x="976" y="244" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#9ae8ef" >04</text><text x="976" y="285" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="750" fill="#fff" >Compute + review</text><text x="976" y="322" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#e1d8e5" >Carrier properties</text><text x="976" y="348" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#e1d8e5" >and uncertainty</text>
<rect x="43" y="431" width="704" height="177" rx="14" fill="#20283b" stroke="#789eb3" stroke-width="2"/>
<text x="67" y="468" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#a8e2ed" >MODEL RELATIONSHIPS</text>
<text x="70" y="506" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff" >Rₛ from Van der Pauw equation; ρ = Rₛ × t</text>
<text x="70" y="544" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#f9d9eb" >Rₕ = Vₕ × t / (I × B)     n = 1 / (q × |Rₕ|)</text>
<text x="70" y="580" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#cadbe9" >μ = |Rₕ| / ρ    ·    single-carrier approximation</text>
<rect x="777" y="431" width="459" height="177" rx="14" fill="#402939" stroke="#a7658d" stroke-width="2"/>
<text x="799" y="469" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#ffc0de" >WHAT STILL NEEDS VERIFICATION</text>
<text x="799" y="506" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#f1e1ee" >Original Rₐ, Rᵦ and wafer thickness</text><text x="799" y="534" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#f1e1ee" >Measured Hall voltage, field and current</text><text x="799" y="562" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#f1e1ee" >Contact polarity and uncertainty model</text>
<text x="43" y="643" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#e3cfdf" >Method equations do not establish 2025 instrument accuracy, material identity or doping.</text>
