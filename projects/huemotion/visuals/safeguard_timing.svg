<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">HueMotion scene triggering safeguards</title><desc id="desc">Original browser source stabilizes detection over frame counts, imposes a 2.5 second repeat cooldown, and delays Off scene dispatch.</desc><rect width="1000" height="510" rx="24" fill="#fcfafc"/><rect x="12" y="12" width="976" height="486" rx="18" fill="#fff" stroke="#e6d9e6" stroke-width="2"/><text x="55" y="62" fill="#3c2942" font-family="Arial,sans-serif" font-size="29" font-weight="700">Gesture timing and dispatch safeguards</text><text x="55" y="94" fill="#6b5c70" font-family="Arial,sans-serif" font-size="15">Original client-side thresholds. Demonstration controls, not server-side authorization.</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a14e79" stroke-width="2"/></marker></defs><text x="55" y="171" fill="#4b344c" font-size="17" font-family="Arial,sans-serif" font-weight="700">Scene repeat cooldown</text><rect x="290" y="153" width="595" height="27" rx="7" fill="#eee7ed"/><rect x="290" y="153" width="425" height="27" rx="7" fill="#c06d9c"/><text x="724" y="173" fill="#513453" font-size="16" font-family="Arial,sans-serif">2500 ms</text><text x="55" y="236" fill="#4b344c" font-size="17" font-family="Arial,sans-serif" font-weight="700">Off hold (Fist)</text><rect x="290" y="218" width="595" height="27" rx="7" fill="#eee7ed"/><rect x="290" y="218" width="127.5" height="27" rx="7" fill="#5598ae"/><text x="426.5" y="238" fill="#513453" font-size="16" font-family="Arial,sans-serif">750 ms</text><text x="55" y="301" fill="#4b344c" font-size="17" font-family="Arial,sans-serif" font-weight="700">Off after Green</text><rect x="290" y="283" width="595" height="27" rx="7" fill="#eee7ed"/><rect x="290" y="283" width="204" height="27" rx="7" fill="#8f87cb"/><text x="503" y="303" fill="#513453" font-size="16" font-family="Arial,sans-serif">1200 ms</text><text x="55" y="366" fill="#4b344c" font-size="17" font-family="Arial,sans-serif" font-weight="700">Off after Blue</text><rect x="290" y="348" width="595" height="27" rx="7" fill="#eee7ed"/><rect x="290" y="348" width="152.99999999999997" height="27" rx="7" fill="#ba9359"/><text x="452" y="368" fill="#513453" font-size="16" font-family="Arial,sans-serif">900 ms</text><text x="53" y="442" font-size="16" font-family="Arial,sans-serif" fill="#514055">Frame stabilization: default 4; Heart / Thumbs Up 2; Crying 1; Shaka / Fist 3; Unknown 8.</text><text x="53" y="469" font-size="14" font-family="Arial,sans-serif" fill="#866d7e">Timing applies in the browser. Direct server calls can bypass these checks in the original implementation.</text></svg>