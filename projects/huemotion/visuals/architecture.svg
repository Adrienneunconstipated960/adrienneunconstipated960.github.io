<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">HueMotion gesture-control architecture</title><desc id="desc">Source-informed diagram of the local demo pipeline and optional scene bridge.</desc><rect width="1000" height="570" rx="24" fill="#fcfafc"/><rect x="12" y="12" width="976" height="546" rx="18" fill="#fff" stroke="#e6d9e6" stroke-width="2"/><text x="55" y="62" fill="#3c2942" font-family="Arial,sans-serif" font-size="29" font-weight="700">HueMotion | Gesture control architecture</text><text x="55" y="94" fill="#6b5c70" font-family="Arial,sans-serif" font-size="15">Recovered from server.casambi.js; real network control was not exercised.</text><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#aa6b93" stroke-width="2"/></marker></defs><rect x="46" y="144" width="190" height="110" rx="14" fill="#eaf2f8" stroke="#86a3bb" stroke-width="2"/><text x="141" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#482e49">Webcam</text><text x="141" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">Browser permission</text><text x="141" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">Live video frames</text><rect x="282" y="144" width="190" height="110" rx="14" fill="#eaf2f8" stroke="#86a3bb" stroke-width="2"/><text x="377" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#482e49">MediaPipe</text><text x="377" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">21 hand landmarks</text><text x="377" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">1-2 detected hands</text><rect x="520" y="144" width="200" height="110" rx="14" fill="#f8f1f7" stroke="#bc648e" stroke-width="2"/><text x="620" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#482e49">Gesture logic</text><text x="620" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">Classify + stabilize</text><text x="620" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">8 supported states</text><rect x="767" y="144" width="190" height="110" rx="14" fill="#f3ebf7" stroke="#8f6caa" stroke-width="2"/><text x="862" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#482e49">RGBW preview</text><text x="862" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">On-screen channels</text><text x="862" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">No lights required</text><path d="M237,199 L279,199" fill="none" stroke="#aa6b93" stroke-width="3" marker-end="url(#arrow)"/><path d="M473,199 L516,199" fill="none" stroke="#aa6b93" stroke-width="3" marker-end="url(#arrow)"/><path d="M721,199 L764,199" fill="none" stroke="#aa6b93" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="336" width="200" height="113" rx="14" fill="#fff4e7" stroke="#c3924d" stroke-width="2"/><text x="620" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#482e49">Dispatch gate</text><text x="620" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">Opt-in + Off hold</text><text x="620" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">2.5-second cooldown</text><rect x="766" y="336" width="192" height="113" rx="14" fill="#fff0f2" stroke="#c26785" stroke-width="2"/><text x="862" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#482e49">Local Node.js</text><text x="862" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">GET /control?key=...</text><text x="862" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">Key allowlist only</text><rect x="766" y="483" width="192" height="62" rx="14" fill="#f3e9f5" stroke="#9a6ea7" stroke-width="2"/><text x="862" y="517" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#482e49">Casambi bridge</text><text x="862" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#695a6d">Scene command</text><path d="M619,255 L619,331" fill="none" stroke="#aa6b93" stroke-width="3" marker-end="url(#arrow)"/><path d="M721,390 L761,390" fill="none" stroke="#aa6b93" stroke-width="3" marker-end="url(#arrow)"/><path d="M860,451 L860,477" fill="none" stroke="#aa6b93" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 455 H497" stroke="#ad577a" stroke-width="2" stroke-dasharray="7 6"/><text x="485" y="451" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#9d3d66">Browser checks do not</text><text x="485" y="472" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#9d3d66">secure the server endpoint</text><text x="53" y="533" font-family="Arial,sans-serif" font-size="14" fill="#766776">Actual Casambi authentication and network control were not tested during recovery.</text></svg>